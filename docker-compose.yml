services:
    # --------------------
    # Database
    # --------------------
    app-db:
        image: postgres:17
        container_name: app-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: portfolio_app
            POSTGRES_USER: app_user
            POSTGRES_PASSWORD: app_pass
        ports:
            - "5433:5432"
        volumes:
            - app_db_data:/var/lib/postgresql/data
        networks:
            - portfolio-net
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app_user -d portfolio_app"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    # --------------------
    # Backend (Next.js)
    # --------------------
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: backend
        restart: unless-stopped
        env_file:
            - .env
        environment:
            NODE_ENV: development
            DATABASE_URL: ${DATABASE_URL}
            ADMIN_PASSCODE: ${ADMIN_PASSCODE}
            CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
            DO_SPACES_ENDPOINT: https://nyc3.digitaloceanspaces.com
            DO_SPACES_REGION: nyc3
            DO_SPACES_BUCKET: portfolio-app
            DO_SPACES_ACCESS_KEY_ID: ${DO_SPACES_ACCESS_KEY_ID}
            DO_SPACES_SECRET_ACCESS_KEY: ${DO_SPACES_SECRET_ACCESS_KEY}
            DO_SPACES_CDN_ENDPOINT: https://portfolio-app.nyc3.cdn.digitaloceanspaces.com
            PORT: 8080
            GMAIL_USER: ${GMAIL_USER:-}
            GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
            TESTIMONIAL_NOTIFY_EMAIL: ${TESTIMONIAL_NOTIFY_EMAIL:-aminebaha115@gmail.com}
            TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
        depends_on:
            app-db:
                condition: service_healthy
        ports:
            - "8080:8080"
        networks:
            - portfolio-net

    # --------------------
    # Frontend (Next.js)
    # --------------------
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
                NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        container_name: frontend
        restart: unless-stopped
        env_file:
            - .env
        environment:
            NODE_ENV: development
            NEXT_PUBLIC_API_URL: http://localhost:8080
            NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
            API_URL: http://backend:8080
            ADMIN_PASSCODE: ${ADMIN_PASSCODE}
            PORT: 3000
        depends_on:
            - backend
        ports:
            - "3000:3000"
        networks:
            - portfolio-net

    # --------------------
    # Database Admin (pgAdmin) - Development Only
    # Use profile to start: docker compose --profile pgadmin up -d
    # --------------------
    pgadmin:
        profiles: ["pgadmin"]
        image: dpage/pgadmin4:8.8
        container_name: pgadmin
        restart: unless-stopped
        env_file:
            - .env
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@portfolio.com}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
            PGADMIN_CONFIG_SERVER_MODE: "False"
        ports:
            - "5050:80"
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        networks:
            - portfolio-net
        depends_on:
            - app-db

networks:
    portfolio-net:

volumes:
    app_db_data:
    pgadmin_data:
